<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог | Industry Main Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="main.html#hero" aria-label="IMG Главная">
        <span class="logo-main">IMG</span>
        <span class="logo-sub">Industry Main Group</span>
      </a>
      <nav class="main-nav" aria-label="Основная навигация">
        <a href="main.html#about">О компании</a>
        <a href="catalog.html">Каталог</a>
        <a href="main.html#request">Заявка</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="catalog" class="section section-accent">
      <div class="container">
        <div class="section-head">
          <h2>Каталог товаров и услуг</h2>
          <p>Выберите вкладку с нужным направлением.</p>
        </div>
        <div class="category-filter" role="tablist" aria-label="Вкладки каталога">
          <button class="filter-btn active" data-filter="Оборудование" role="tab" aria-selected="true">Буровое оборудование</button>
          <button class="filter-btn" data-filter="Запчасти" role="tab" aria-selected="false">Запчасти</button>
          <button class="filter-btn" data-filter="Двигатели" role="tab" aria-selected="false">Двигатели</button>
          <button class="filter-btn" data-filter="Услуги-буровой инструмент" role="tab" aria-selected="false">Буровой инструмент</button>
        </div>
        <div id="enginePurposeSortWrap" class="engine-sort" hidden>
          <label for="enginePurposeSort">Сортировка по назначению двигателя:</label>
          <select id="enginePurposeSort" aria-label="Сортировка по назначению двигателя">
            <option value="all">Все назначения</option>
          </select>
        </div>
        <div id="catalogGrid" class="catalog-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p class="footer-brand">ООО «Индастри Майн Групп»</p>
        <p class="footer-copy">Поставки горно-шахтного оборудования и бурового инструмента.</p>
      </div>
      <div class="footer-contacts">
        <a href="mailto:andrienko@img-industry.ru">andrienko@img-industry.ru</a>
        <a href="tel:+79244124015">+7 (924) 412-40-15</a>
        <a href="tel:+79147237555">+7(914)723-75-55</a>
        <a
          class="map-link"
          href="https://2gis.ru/vladivostok/search/%D0%98%D0%BD%D0%B4%D0%B0%D1%81%D1%82%D1%80%D0%B8%20%D0%9C%D0%B0%D0%B9%D0%BD%20%D0%93%D1%80%D1%83%D0%BF%D0%BF"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Открыть офисы компании в 2GIS"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2a7 7 0 0 0-7 7c0 4.74 5.28 11.64 6.01 12.58a1.24 1.24 0 0 0 1.98 0C13.72 20.64 19 13.74 19 9a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
          </svg>
          <span>Офисы на 2GIS</span>
        </a>
      </div>
    </div>
  </footer>

  <div id="productModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalClose" class="modal-close" aria-label="Закрыть">×</button>
      <img id="modalImage" src="" alt="Изображение товара">
      <h3 id="modalTitle"></h3>
      <p id="modalCategory" class="modal-category"></p>
      <p id="modalDescription"></p>
      <ul id="modalSpecs" class="spec-list"></ul>
      <p id="modalPrice" class="modal-price"></p>
    </div>
  </div>
</body>
</html>
